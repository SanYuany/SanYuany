name: Verify and capture SwitchBot V4
on:
  push:
    branches: [switchbot-living-world-v4]
    paths: ['.github/workflows/switchbot-v4-verify.yml', 'switchbot-living-world-v4/**']
  workflow_dispatch:
concurrency:
  group: switchbot-v4-visual-check
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  visual-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: switchbot-living-world-v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed one-time visual corrections
        working-directory: switchbot-living-world-v4
        run: |
          mkdir -p assets evidence
          if [ -f scripts/refine-visuals.mjs ]; then node scripts/refine-visuals.mjs; rm scripts/refine-visuals.mjs; fi
      - name: Functional unit tests and production build
        working-directory: switchbot-living-world-v4
        run: |
          set -o pipefail
          npm test | tee evidence/unit-tests.txt
          npm run check
          npm run build
      - name: Preserve corrected modular source on isolated branch
        run: |
          git config user.name 'SwitchBot Project Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add switchbot-living-world-v4
          if ! git diff --cached --quiet; then git commit -m 'fix: apply reviewed V4 camera and lighting corrections'; git push origin HEAD:switchbot-living-world-v4; fi
      - name: Install browser verification runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start actual HTTP preview
        working-directory: switchbot-living-world-v4
        run: |
          node scripts/serve.mjs > /tmp/switchbot-v4-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4174/ > /dev/null
      - name: Actual WebGL, desktop and mobile screenshots, interaction and video
        working-directory: switchbot-living-world-v4
        env:
          BASE_URL: http://127.0.0.1:4174
        run: node tests/browser.mjs
      - name: Capture deliverable package
        if: always()
        run: |
          tar --exclude=node_modules --exclude=__pycache__ --exclude=refine-visuals.mjs -czf /tmp/switchbot-living-world-v4-delivery.tar.gz switchbot-living-world-v4
      - name: Upload actual visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switchbot-v4-visual-evidence
          path: switchbot-living-world-v4/evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Upload source and static build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switchbot-v4-delivery
          path: /tmp/switchbot-living-world-v4-delivery.tar.gz
          retention-days: 14
          if-no-files-found: error
