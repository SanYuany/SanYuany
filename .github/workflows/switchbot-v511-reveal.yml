name: Verify V5.1.1 same-house reveal
on:
  push:
    branches: [switchbot-living-world-v5]
    paths: ['delivery/v511-*', '.github/workflows/switchbot-v511-reveal.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: switchbot-v511-reveal
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source change without replacing the existing house
        run: |
          git apply --check --unidiff-zero --directory=switchbot-living-world-v5 delivery/v511-reveal.patch
          git apply --unidiff-zero --directory=switchbot-living-world-v5 delivery/v511-reveal.patch
          cp delivery/v511-browser.mjs switchbot-living-world-v5/tests/reveal-browser.mjs
      - name: Test, build and produce portable page
        working-directory: switchbot-living-world-v5
        run: |
          mkdir -p evidence/reveal
          set -o pipefail
          npm test | tee evidence/reveal/unit-tests.txt
          npm run check
          npm run build
          npm run portable
      - name: Verify browser and encoder before rendering
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          ffmpeg -version | head -1
      - name: Start HTTP preview
        run: |
          python3 -m http.server 4188 --directory switchbot-living-world-v5 >/tmp/sb-v511-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4188/ >/dev/null
      - name: Real browser interactions, visual evidence and continuous films
        run: node delivery/v511-browser.mjs
      - name: Preserve verified modular source on the existing V5 branch
        run: |
          git config user.name 'SwitchBot Project Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add switchbot-living-world-v5/src switchbot-living-world-v5/tests switchbot-living-world-v5/docs switchbot-living-world-v5/package.json switchbot-living-world-v5/index.html
          if ! git diff --cached --quiet; then git commit -m 'feat: verified same-house exterior reveal and spatial room controls'; git push origin HEAD:switchbot-living-world-v5; fi
      - name: Preserve deliverable even if a visual test fails
        if: always()
        run: |
          tar --exclude=node_modules --exclude=.git --exclude=frames-desktop --exclude=frames-mobile -czf /tmp/SwitchBot-Living-World-V5.1.1.tar.gz switchbot-living-world-v5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switchbot-v511-delivery
          path: /tmp/SwitchBot-Living-World-V5.1.1.tar.gz
          retention-days: 30
          if-no-files-found: error
