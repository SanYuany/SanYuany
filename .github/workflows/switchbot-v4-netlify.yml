name: Deploy SwitchBot V4 to authorized Netlify site
on:
  push:
    branches: [switchbot-living-world-v4]
    paths: ['.github/workflows/switchbot-v4-netlify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: switchbot-living-world-v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare ephemeral deployment authorization channel
        run: |
          node --input-type=module <<'JS'
          import {generateKeyPairSync} from 'node:crypto';
          import fs from 'node:fs';
          const pair=generateKeyPairSync('rsa',{modulusLength:4096,publicKeyEncoding:{type:'spki',format:'pem'},privateKeyEncoding:{type:'pkcs8',format:'pem'}});
          fs.writeFileSync('/tmp/switchbot-deploy-private.pem',pair.privateKey,{mode:0o600});
          fs.mkdirSync('/tmp/switchbot-deploy-public',{recursive:true});
          fs.writeFileSync('/tmp/switchbot-deploy-public/public-key.pem',pair.publicKey);
          fs.writeFileSync('/tmp/switchbot-deploy-public/session.json',JSON.stringify({runId:process.env.GITHUB_RUN_ID,siteId:'31ad7518-78b8-4219-8463-839dde228c31',created:new Date().toISOString()}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: switchbot-netlify-public-key
          path: /tmp/switchbot-deploy-public/
          retention-days: 1
          if-no-files-found: error
      - name: Receive encrypted authorization and deploy reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {privateDecrypt,createDecipheriv,constants} from 'node:crypto';
          import {spawnSync,spawn} from 'node:child_process';
          const run=process.env.GITHUB_RUN_ID,repo=process.env.GITHUB_REPOSITORY,site='31ad7518-78b8-4219-8463-839dde228c31';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          fs.mkdirSync('/tmp/deployment-receipt',{recursive:true});
          try{
            let envelope;
            for(let i=0;i<85;i++){
              const response=await fetch(`https://api.github.com/repos/${repo}/contents/.delivery/netlify-envelope-${run}.json?ref=switchbot-living-world-v4`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
              if(response.ok){const file=await response.json();envelope=JSON.parse(Buffer.from(file.content,'base64').toString('utf8'));break;}
              if(response.status!==404)throw Error(`Authorization channel HTTP ${response.status}`);
              if(i%12===0)console.log('Waiting for encrypted one-time authorization.');
              await sleep(8000);
            }
            if(!envelope)throw Error('Authorization window expired');
            if(envelope.runId!==run)throw Error('Authorization session mismatch');
            const privateKey=fs.readFileSync('/tmp/switchbot-deploy-private.pem');
            const key=privateDecrypt({key:privateKey,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},Buffer.from(envelope.key,'base64'));
            const decipher=createDecipheriv('aes-256-gcm',key,Buffer.from(envelope.iv,'base64'));decipher.setAAD(Buffer.from(run));decipher.setAuthTag(Buffer.from(envelope.tag,'base64'));
            const payload=JSON.parse(Buffer.concat([decipher.update(Buffer.from(envelope.ciphertext,'base64')),decipher.final()]).toString('utf8'));
            fs.rmSync('/tmp/switchbot-deploy-private.pem',{force:true});
            if(payload.siteId!==site||!/^https:\/\/netlify-mcp\.netlify\.app\/proxy\/[A-Za-z0-9._-]+$/.test(payload.proxyPath)||!/^\w{40}$/.test(payload.sourceSha))throw Error('Invalid deployment scope');
            console.log('::add-mask::'+payload.proxyPath);
            for(const args of [['fetch','origin',payload.sourceSha],['checkout','--detach',payload.sourceSha]]){const result=spawnSync('git',args,{stdio:'inherit'});if(result.status!==0)throw Error('Reviewed source checkout failed');}
            const directory=process.cwd()+'/switchbot-living-world-v4';fs.mkdirSync(directory+'/assets',{recursive:true});
            let output='';const clean=s=>s.split(payload.proxyPath).join('[REDACTED]');
            const env={...process.env,CI:'true',NETLIFY_TELEMETRY_DISABLED:'1'};delete env.GH_TOKEN;delete env.GITHUB_TOKEN;
            const exitCode=await new Promise((resolve,reject)=>{
              const child=spawn('npx',['-y','@netlify/mcp@latest','--site-id',site,'--proxy-path',payload.proxyPath],{cwd:directory,env,stdio:['ignore','pipe','pipe']});
              child.stdout.on('data',b=>{output+=b.toString();process.stdout.write(clean(b.toString()));});child.stderr.on('data',b=>{output+=b.toString();process.stderr.write(clean(b.toString()));});child.on('error',reject);child.on('exit',resolve);
            });
            const receipt={siteId:site,sourceSha:payload.sourceSha,exitCode,completedAt:new Date().toISOString(),output:clean(output).slice(-12000)};
            fs.writeFileSync('/tmp/deployment-receipt/result.json',JSON.stringify(receipt,null,2));
            if(exitCode!==0)throw Error(`Deployment process exited ${exitCode}`);
          }finally{fs.rmSync('/tmp/switchbot-deploy-private.pem',{force:true});}
          JS
      - name: Publish non-secret deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switchbot-netlify-deployment-receipt
          path: /tmp/deployment-receipt/
          retention-days: 14
          if-no-files-found: warn
