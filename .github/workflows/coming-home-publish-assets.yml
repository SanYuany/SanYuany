name: Publish original Coming Home media
on:
  push:
    branches: [switchbot-coming-home-study]
    paths: ['.github/workflows/coming-home-publish-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35176875535
          pattern: r4-film-*
          path: /tmp/original-r4
      - name: Prepare encoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/tmp/media-install.log
          python3 -m pip install Pillow --quiet
      - name: Preserve the exact original films and original CG reference crops
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import subprocess, hashlib, json
          source=Path('/tmp/original-r4')
          out=Path('coming-home-public/media')
          out.mkdir(parents=True,exist_ok=True)
          expected={'desktop':'51821fad458bfbac0a062e21b4eff4e80aa19bec040b626ed6ca01e654f0e11f','mobile':'ce917d4b93a299bb633a57a7a80022c992b0028851bf4c12faecc3c0e6aa8514'}
          def locate(view,half,name):
            matches=list((source/f'r4-film-{view}-{half}').rglob(name))
            assert len(matches)==1,(view,half,name,matches)
            return matches[0]
          for view in ['desktop','mobile']:
            listing=Path('/tmp')/f'{view}-concat.txt'
            listing.write_text(''.join("file '"+str(locate(view,n,'chunk.mp4'))+"'\n" for n in [0,1]))
            movie=out/f'coming-home-{view}.mp4'
            subprocess.run(['ffmpeg','-v','error','-y','-f','concat','-safe','0','-i',str(listing),'-c','copy','-movflags','+faststart',str(movie)],check=True)
            assert hashlib.sha256(movie.read_bytes()).hexdigest()==expected[view],'Film differs from the delivered R4 original'
            subprocess.run(['ffmpeg','-v','error','-i',str(movie),'-f','null','-'],check=True)
            Image.open(locate(view,0,'0.png')).convert('RGB').save(out/f'poster-{view}.jpg',quality=90,optimize=True)
          for role,frame in [('lock','8.2.png'),('keypad','6.4.png'),('hub','19.8.png')]:
            im=Image.open(locate('desktop',0,frame)).convert('RGB')
            ImageOps.fit(im,(480,480),Image.Resampling.LANCZOS,centering=(.5,.5)).save(out/f'scene-{role}.jpg',quality=90,optimize=True)
          files={p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted(out.iterdir()) if p.is_file()}
          manifest={'edition':'Coming Home R4.1','sourceRun':35176875535,'origin':'Original CG generated by the assistant for this project; no user-uploaded or third-party media. Product geometry is illustrative, not approved CAD.','files':files}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Commit only the original public media on the existing isolated branch
        run: |
          git config user.name 'SwitchBot Project Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coming-home-public/media
          if ! git diff --cached --quiet; then
            git commit -m 'assets: preserve checksum-matched R4 films and original CG crops'
            git push origin HEAD:switchbot-coming-home-study
          fi
          git rev-parse HEAD > /tmp/public-media-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coming-home-publication-manifest
          path: |
            /tmp/public-media-commit.txt
            coming-home-public/media/manifest.json
          retention-days: 30
