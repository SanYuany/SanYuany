name: Publish original Coming Home media
on:
  push:
    branches: [switchbot-coming-home-study]
    paths: ['.github/workflows/coming-home-publish-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35176875535
          pattern: r4-film-*
          path: /tmp/original-r4
      - name: Prepare encoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/tmp/media-install.log
          python3 -m pip install Pillow --quiet
      - name: Verify every decoded frame against the delivered original
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import subprocess, hashlib, json
          source=Path('/tmp/original-r4')
          out=Path('coming-home-public/media')
          out.mkdir(parents=True,exist_ok=True)
          # Container bytes can differ between FFmpeg versions. These are the
          # SHA-256 of all 576 decoded-frame MD5s from the delivered originals.
          expected={'desktop':'cbc41b7749429a6cfe5e02a0c2d1dec3f71e2ca5a6b2523cc51860e037e817bc','mobile':'04a1500473fea99a9fc91acbea235078a676c7199e23878a0c02c7143335b167'}
          proofs={}
          def locate(view,half,name):
            matches=list((source/f'r4-film-{view}-{half}').rglob(name))
            assert len(matches)==1,(view,half,name,matches)
            return matches[0]
          for view in ['desktop','mobile']:
            listing=Path('/tmp')/f'{view}-concat.txt'
            listing.write_text(''.join("file '"+str(locate(view,n,'chunk.mp4'))+"'\n" for n in [0,1]))
            movie=out/f'coming-home-{view}.mp4'
            subprocess.run(['ffmpeg','-v','error','-y','-f','concat','-safe','0','-i',str(listing),'-c','copy','-movflags','+faststart',str(movie)],check=True)
            decoded=subprocess.check_output(['ffmpeg','-v','error','-i',str(movie),'-map','0:v:0','-f','framemd5','-']).decode()
            hashes=[row.split(',')[-1].strip() for row in decoded.splitlines() if row and not row.startswith('#')]
            actual=hashlib.sha256(('\n'.join(hashes)+'\n').encode()).hexdigest()
            assert len(hashes)==576 and actual==expected[view],('Decoded imagery differs from original',view,actual)
            probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height,duration,r_frame_rate','-of','json',str(movie)]))['streams'][0]
            assert float(probe['duration'])==24 and probe['r_frame_rate']=='24/1',probe
            proofs[view]={'decodedFrames':576,'decodedSequenceSha256':actual,'matchesOriginalVisuals':True,**probe}
            Image.open(locate(view,0,'0.png')).convert('RGB').save(out/f'poster-{view}.jpg',quality=90,optimize=True)
          for role,frame in [('lock','8.2.png'),('keypad','6.4.png'),('hub','19.8.png')]:
            im=Image.open(locate('desktop',0,frame)).convert('RGB')
            ImageOps.fit(im,(480,480),Image.Resampling.LANCZOS,centering=(.5,.5)).save(out/f'scene-{role}.jpg',quality=90,optimize=True)
          files={p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted(out.iterdir()) if p.is_file() and p.name!='manifest.json'}
          manifest={'edition':'Coming Home R4.1','sourceRun':35176875535,'origin':'Original CG generated by the assistant for this project; no user-uploaded or third-party media. Product geometry is illustrative, not approved CAD.','verification':proofs,'files':files}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Commit only the original public media on the existing isolated branch
        run: |
          git config user.name 'SwitchBot Project Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coming-home-public/media
          if ! git diff --cached --quiet; then
            git commit -m 'assets: preserve frame-identical original R4 films with checksums'
            git push origin HEAD:switchbot-coming-home-study
          fi
          git rev-parse HEAD > /tmp/public-media-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coming-home-publication-manifest
          path: |
            /tmp/public-media-commit.txt
            coming-home-public/media/manifest.json
          retention-days: 30
