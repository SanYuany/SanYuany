name: Deploy SwitchBot Living World

on:
  push:
    branches: [main]
    paths:
      - 'switchbot-living-world/**'
      - '.github/workflows/deploy-switchbot-living-world.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: switchbot-living-world-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify project
        working-directory: switchbot-living-world
        run: |
          npm test
          npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: switchbot-living-world

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
