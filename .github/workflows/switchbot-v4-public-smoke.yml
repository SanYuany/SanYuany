name: Verify SwitchBot V4 public review URL
on:
  push:
    branches: [switchbot-living-world-v4]
    paths: ['.github/workflows/switchbot-v4-public-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify actual public HTTP page and WebGL scene
        run: |
          mkdir -p public-evidence
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const url='https://rawcdn.githack.com/SanYuany/SanYuany/556968a8b323c61aba8198a0d7ca999f3fe4c45d/switchbot-living-world-v4/index.html';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const page=await browser.newPage({viewport:{width:1440,height:960},deviceScaleFactor:1});
          const report={url,sourceSha:'556968a8b323c61aba8198a0d7ca999f3fe4c45d',checkedAt:new Date().toISOString(),errors:[],checks:[]};
          page.on('pageerror',e=>report.errors.push(e.message));
          const snap=async name=>{const c=await page.context().newCDPSession(page);const r=await c.send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});fs.writeFileSync('public-evidence/'+name+'.png',Buffer.from(r.data,'base64'));await c.detach();};
          try{
            const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});assert.equal(r.status(),200);report.checks.push('HTTP 200');
            await page.waitForFunction(()=>window.__livingWorld?.canvas.dataset.ready==='true',null,{timeout:90000});
            assert.equal(await page.locator('#fallback').isVisible(),false);report.checks.push('Renderer visible, no fallback overlay');
            await page.evaluate(()=>window.__app.seek(0,true));await page.waitForTimeout(500);await snap('public-desktop-overview');
            const a=await page.evaluate(()=>window.__livingWorld.snapshot());
            await page.evaluate(()=>window.__app.seek(.71,true));await page.waitForTimeout(1000);const b=await page.evaluate(()=>window.__livingWorld.snapshot());
            assert.ok(Math.hypot(...a.camera.map((v,i)=>v-b.camera[i]))>3);assert.ok(b.triangles>5000);assert.ok(b.state.living>.9);report.checks.push('Live 3D camera and device state respond to scrolling');await snap('public-desktop-living');
            await page.setViewportSize({width:390,height:844});await page.evaluate(()=>window.__app.seek(.21,true));await page.waitForTimeout(1000);assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));await snap('public-mobile-morning');report.checks.push('Mobile WebGL and no horizontal overflow');
            await page.locator('#planNav').click();await page.locator('#windowCount').selectOption('2');await page.locator('[data-owned="curtain"]').fill('1');assert.equal(await page.evaluate(()=>window.__currentPlan.products.find(x=>x.id==='curtain').toBuy),3);report.checks.push('Public plan configuration updates quantity');
            assert.deepEqual(report.errors,[]);report.result='PASS';
          }catch(e){report.result='FAIL';report.failure=e.stack;try{await snap('public-failure');}catch{};}
          finally{fs.writeFileSync('public-evidence/public-report.json',JSON.stringify(report,null,2));await browser.close();}
          if(report.result!=='PASS')process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switchbot-v4-public-smoke
          path: public-evidence/
          retention-days: 14
          if-no-files-found: error
